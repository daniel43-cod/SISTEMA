services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_desarrollo}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configura POSTGRES_ADMIN_PASSWORD}
      APP_DATABASE_USER: ${POSTGRES_USER:-sistema_app}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./BACKEND/docker/postgres/10-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    image: pos-backend:dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConexionPostgres: ${POSTGRES_CONNECTION_STRING:?Configura POSTGRES_CONNECTION_STRING con Host=postgres}
      Jwt__Key: ${JWT_KEY:?Configura JWT_KEY de al menos 32 bytes}
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Front-End.web/Front-End
      dockerfile: Dockerfile
    image: pos-frontend:dev
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads: